<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Local-first finance dashboard</p>
        <h1 id="page-title">Expense Tracker</h1>
        <p class="lede">Track spending, visualize categories, and keep your data saved in this browser with local storage.</p>
      </div>
      <div class="summary-grid" aria-label="Expense summary">
        <article class="summary-card income"><span>Income</span><strong id="incomeTotal">$0.00</strong></article>
        <article class="summary-card expense"><span>Expenses</span><strong id="expenseTotal">$0.00</strong></article>
        <article class="summary-card balance"><span>Balance</span><strong id="balanceTotal">$0.00</strong></article>
      </div>
    </section>

    <section class="panel form-panel" aria-labelledby="form-title">
      <h2 id="form-title">Add transaction</h2>
      <form id="expenseForm">
        <label>Title<input id="title" name="title" type="text" placeholder="Groceries" required maxlength="60"></label>
        <label>Amount<input id="amount" name="amount" type="number" placeholder="45.50" min="0.01" step="0.01" required></label>
        <label>Type<select id="type" name="type"><option value="expense">Expense</option><option value="income">Income</option></select></label>
        <label>Category<select id="category" name="category"><option>Food</option><option>Transport</option><option>Housing</option><option>Utilities</option><option>Shopping</option><option>Health</option><option>Salary</option><option>Other</option></select></label>
        <label>Date<input id="date" name="date" type="date" required></label>
        <button type="submit">Add transaction</button>
      </form>
    </section>

    <section class="dashboard">
      <article class="panel chart-panel">
        <div class="panel-heading"><h2>Spending by category</h2><button id="resetData" type="button">Reset demo data</button></div>
        <canvas id="categoryChart" width="620" height="320" aria-label="Bar chart of spending by category"></canvas>
      </article>
      <article class="panel chart-panel">
        <h2>Income vs expenses</h2>
        <canvas id="donutChart" width="360" height="320" aria-label="Donut chart of income versus expenses"></canvas>
      </article>
    </section>

    <section class="panel" aria-labelledby="transactions-title">
      <div class="panel-heading"><h2 id="transactions-title">Transactions</h2><button id="clearAll" type="button" class="danger">Clear all</button></div>
      <ul id="transactionList" class="transaction-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
